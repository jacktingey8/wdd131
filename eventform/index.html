<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
</head>
<body>
    <main class="wrapper">
        
    
        <form id="eventForm">
            <h1>Event Ticket</h1>
            <div id="formContainer">
        <div class="field">
            <label for="firstName">First Name</label>
            <input id="firstName" name="firstName" type="text" required />
        </div>
        <div class="field">
            <label for="lastName">Last Name</label>
            <input id="lastName" name="lastName" type="text" required />
        </div>
        <div class="field" id="emailContainer">
            <label for="email">Email</label>
            <input id="email" name="email" type="email" required />
        </div>
        <div class="field">
            <label for="type">Type</label>
            <select id="type" name="type" required>
            <option value="">Choose one</option>
            <option value="Student">Student</option>
            <option value="Guest">Guest</option>
            </select>
        </div>
       <div class="field">
            <label for="Date">Date</label>
            <input id="Date" name="Date" type="date" required />
        </div>
        <div id="studentIDContainer" class="opfield" hidden>
            <label for="studentID">Student ID</label>
            <input id="studentID" name="studentID" type="text"/>
        </div>
        </div>
        <div id="accessCodeContainer" class="opfield" hidden>
            <label for="accessCode">Access Code</label>
            <input id="accessCode" name="accessCode" type="text"/>
        </div>

        <button class="sbmtbtn" type="submit">Create Ticket</button>
        <section id="output"></section>
        
        </form>

        
    </main>

</body>
</html>
